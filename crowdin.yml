# Crowdin configuration for Donetick
# See: https://support.crowdin.com/configuration-file/

project_id: '878780'
api_token_env: CROWDIN_API_TOKEN
preserve_hierarchy: true

languages_mapping:
  two_letters_code:
    zh-CN: zh-CN

files:
  - source: /public/locales/en/*.json
    translation: /public/locales/%two_letters_code%/%original_file_name%
    # Required so Crowdin treats _one/_other as plurals and exports every
    # target language's runtime categories (for example, Italian _many).
    type: i18next_json
    update_option: update_as_unapproved
    skip_untranslated_strings: true
