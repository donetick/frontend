<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/logo.svg" /> -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Donetick</title>

    <!-- Resolves the user's saved mode (mirrors MUI Joy's useColorScheme, which
    persists 'light' | 'dark' | 'system' to localStorage['joy-mode']) and skin
    (localStorage['donetick-theme-skin']) before first paint, so the startup
    screen below doesn't flash the OS theme or the default cyan accent when the
    user has chosen otherwise in-app.

    STARTUP_TOKENS mirrors src/constants/startupTheme.js, which the React
    startup screens apply through the same custom properties. Keep both copies
    in sync; tests/startup-screen.test.mjs asserts they match. -->
    <script>
      ;(function () {
        // prettier-ignore
        var STARTUP_TOKENS = {
          default: {
            light: ['#fbfcfe', '#ffffff', '#0891b2', '#cffafe', '#a5f3fc', '#e9eaf0'],
            dark: ['#101216', '#1b1e25', '#67e8f9', '#164e63', '#155e75', '#2b2f39'],
          },
          forest: {
            light: ['#f4f8f4', '#f4faf6', '#059669', '#d1fae5', '#a7f3d0', '#e7e5e4'],
            dark: ['#101914', '#18251e', '#6ee7b7', '#064e3b', '#065f46', '#292524'],
          },
          lavender: {
            light: ['#f7f5fc', '#faf7ff', '#7c3aed', '#ede9fe', '#ddd6fe', '#e2e8f0'],
            dark: ['#171321', '#211c2e', '#c4b5fd', '#4c1d95', '#5b21b6', '#1e293b'],
          },
          sand: {
            light: ['#faf6ef', '#fffaf3', '#d97706', '#fef3c7', '#fde68a', '#e7e5e4'],
            dark: ['#1c1813', '#292219', '#fcd34d', '#78350f', '#92400e', '#292524'],
          },
          ocean: {
            light: ['#f0f6fc', '#f5faff', '#2563eb', '#dbeafe', '#bfdbfe', '#e2e8f0'],
            dark: ['#101923', '#192838', '#93c5fd', '#1e3a8a', '#1e40af', '#1e293b'],
          },
          rose: {
            light: ['#fff3f6', '#fff7fa', '#e11d48', '#ffe4e6', '#fecdd3', '#e4e4e7'],
            dark: ['#211419', '#301e26', '#fda4af', '#881337', '#9f1239', '#27272a'],
          },
          sunset: {
            light: ['#fff4ec', '#fff8f2', '#ea580c', '#ffedd5', '#fed7aa', '#e7e5e4'],
            dark: ['#231710', '#332319', '#fdba74', '#7c2d12', '#9a3412', '#292524'],
          },
          bubblegum: {
            light: ['#fff0f8', '#fff5fb', '#db2777', '#fce7f3', '#fbcfe8', '#e4e4e7'],
            dark: ['#100b10', '#1c121a', '#f9a8d4', '#831843', '#9d174d', '#27272a'],
          },
          mint: {
            light: ['#f0faf7', '#f5fcf9', '#0d9488', '#ccfbf1', '#99f6e4', '#e2e8f0'],
            dark: ['#101d1b', '#192d29', '#5eead4', '#134e4a', '#115e59', '#1e293b'],
          },
          graphite: {
            light: ['#f4f4f5', '#fafafa', '#52525b', '#e4e4e7', '#d4d4d8', '#e4e4e7'],
            dark: ['#141416', '#222225', '#d4d4d8', '#27272a', '#3f3f46', '#27272a'],
          },
        }
        var NAMES = ['bg', 'surface', 'accent', 'soft', 'halo', 'border']
        var read = function (key) {
          try {
            return window.localStorage.getItem(key)
          } catch (e) {
            return null
          }
        }
        var stored = read('joy-mode')
        var mode =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        var root = document.documentElement
        root.setAttribute('data-startup-theme', mode)
        var skin = read('donetick-theme-skin')
        var tokens = (STARTUP_TOKENS[skin] || STARTUP_TOKENS.default)[mode]
        for (var i = 0; i < NAMES.length; i++) {
          root.style.setProperty('--startup-' + NAMES[i], tokens[i])
        }
      })()
    </script>

    <!-- Inline so startup is visible before JavaScript and app CSS load. -->
    <style>
      /* Declared on :root, not .startup-screen, so the skin's values — set as
         inline styles on :root by the script above — take precedence. These are
         the fallback for a failed/blocked localStorage read. */
      :root {
        --startup-bg: #fbfcfe;
        --startup-surface: #ffffff;
        --startup-text: #20252b;
        --startup-muted: #747b87;
        --startup-accent: #0891b2;
        --startup-soft: #cffafe;
        --startup-halo: #a5f3fc;
        --startup-border: #e9eaf0;
        --startup-shadow: #1a202c2e;
      }
      .startup-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: auto;
        background: var(--startup-bg);
        color: var(--startup-text);
        font-family: system-ui, sans-serif;
      }
      .startup-screen__content {
        padding: 32px 24px;
        text-align: center;
      }
      .startup-screen__visual {
        position: relative;
        width: 280px;
        height: 220px;
        margin: 0 auto 24px;
        animation: startup-enter 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .startup-screen__halo {
        position: absolute;
        inset: 12px 30px;
        border-radius: 50%;
        background: radial-gradient(
          ellipse,
          var(--startup-halo) 0%,
          transparent 70%
        );
        filter: blur(16px);
        animation: startup-breathe 4s ease-in-out infinite;
      }
      .startup-screen__mascot {
        position: absolute;
        inset: 48px auto auto 78px;
        width: 124px;
        height: 124px;
        display: grid;
        place-items: center;
        border-radius: 36px;
        background: var(--startup-surface);
        border: 1px solid var(--startup-border);
        box-shadow: 0 16px 48px -16px var(--startup-shadow);
        transform: rotate(-6deg);
        animation: startup-float 5s ease-in-out infinite;
      }
      .startup-screen__mascot img {
        display: block;
        width: 88px;
        height: 88px;
      }
      .startup-screen__card {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 10px;
        width: 126px;
        padding: 14px;
        box-sizing: border-box;
        border: 1px solid var(--startup-border);
        border-radius: 18px;
        background: var(--startup-surface);
        box-shadow: 0 8px 24px -12px var(--startup-shadow);
      }
      .startup-screen__card--back {
        top: 22px;
        right: 0;
        transform: rotate(9deg);
        animation: startup-card-back 5s ease-in-out infinite;
      }
      .startup-screen__card--front {
        bottom: 12px;
        left: 0;
        transform: rotate(-8deg);
        animation: startup-card-front 5s ease-in-out infinite;
      }
      .startup-screen__check {
        display: grid;
        place-items: center;
        flex: 0 0 26px;
        height: 26px;
        border-radius: 9px;
        background: var(--startup-soft);
        color: var(--startup-accent);
        font-size: 16px;
        font-weight: 700;
      }
      .startup-screen__card--front .startup-screen__check {
        background: #e2f5ef;
        color: #378776;
      }
      .startup-screen__lines {
        display: grid;
        gap: 7px;
        flex: 1;
      }
      .startup-screen__lines span {
        height: 5px;
        border-radius: 8px;
        background: var(--startup-border);
      }
      .startup-screen__lines span + span {
        width: 65%;
      }
      .startup-screen__spark {
        position: absolute;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #f2c589;
      }
      .startup-screen__spark--one {
        top: 40px;
        left: 30px;
      }
      .startup-screen__spark--two {
        right: 26px;
        bottom: 36px;
        width: 5px;
        height: 5px;
        background: var(--startup-accent);
      }
      .startup-screen__copy {
        animation: startup-enter 700ms cubic-bezier(0.22, 1, 0.36, 1) 100ms both;
      }
      .startup-screen__name {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1.2;
      }
      .startup-screen__name span {
        color: var(--startup-accent);
      }
      .startup-screen__caption {
        margin-top: 12px;
        color: var(--startup-muted);
        font-size: 15px;
        line-height: 1.5;
      }
      .startup-screen__dots {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-top: 28px;
      }
      .startup-screen__dots span {
        width: 6px;
        height: 6px;
        border-radius: 99px;
        background: var(--startup-accent);
        animation: startup-dot 1.6s ease-in-out infinite;
      }
      .startup-screen__dots span:nth-child(2) {
        animation-delay: 160ms;
      }
      .startup-screen__dots span:nth-child(3) {
        animation-delay: 320ms;
      }
      @keyframes startup-enter {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes startup-breathe {
        50% {
          transform: scale(1.12);
          opacity: 0.65;
        }
      }
      @keyframes startup-float {
        50% {
          transform: translateY(-7px) rotate(-3deg);
        }
      }
      @keyframes startup-card-back {
        50% {
          transform: translateY(5px) rotate(6deg);
        }
      }
      @keyframes startup-card-front {
        50% {
          transform: translateY(-4px) rotate(-4deg);
        }
      }
      @keyframes startup-dot {
        0%,
        60%,
        100% {
          opacity: 0.3;
          transform: translateY(0);
        }
        30% {
          opacity: 1;
          transform: translateY(-4px);
        }
      }
      :root[data-startup-theme='dark'] {
        --startup-bg: #101216;
        --startup-surface: #1b1e25;
        --startup-text: #f0f1f5;
        --startup-muted: #9ca3b1;
        --startup-accent: #67e8f9;
        --startup-soft: #164e63;
        --startup-halo: #155e75;
        --startup-border: #2b2f39;
        --startup-shadow: #00000066;
      }
      [data-startup-theme='dark']
        .startup-screen__card--front
        .startup-screen__check {
        background: #203c36;
        color: #8ed7bd;
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-screen .startup-screen__content,
        .startup-screen .startup-screen__content * {
          animation: none;
        }
      }
    </style>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />

    <!--
      Plausible. This index.html is shared by the app and the marketing bundles
      (see src/main.jsx), so the tag is gated rather than hardcoded: it loads
      only when the page host matches VITE_APP_PLAUSIBLE_DOMAIN, which is the
      site registered in Plausible. On app.donetick.com the host never matches,
      so nothing loads. Unset the variable to disable it entirely.
    -->
    <script>
      ;(function () {
        var domain = 'donetick.com'
        // Vite leaves the literal placeholder when the variable is unset.
        var host = window.location.hostname
        if (host !== domain) return
        var s = document.createElement('script')
        s.defer = true
        // s.setAttribute('data-domain', domain)
        s.setAttribute('data-domain', 'donetick.com')
        s.src = 'https://collector.wannaknow.link/js/script.js'
        document.head.appendChild(s)
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <!-- React replaces this with the matching Suspense fallback on mount. -->
      <div class="startup-screen" role="status" aria-label="Loading Donetick">
        <div class="startup-screen__content">
          <div class="startup-screen__visual" aria-hidden="true">
            <div class="startup-screen__halo"></div>
            <div class="startup-screen__card startup-screen__card--back">
              <span class="startup-screen__check">✓</span>
              <span class="startup-screen__lines"
                ><span></span><span></span
              ></span>
            </div>
            <div class="startup-screen__mascot">
              <img src="/src/assets/logo.svg" width="88" height="88" alt="" />
            </div>
            <div class="startup-screen__card startup-screen__card--front">
              <span class="startup-screen__check">✓</span>
              <span class="startup-screen__lines"
                ><span></span><span></span
              ></span>
            </div>
            <span
              class="startup-screen__spark startup-screen__spark--one"
            ></span>
            <span
              class="startup-screen__spark startup-screen__spark--two"
            ></span>
          </div>
          <div class="startup-screen__copy">
            <div class="startup-screen__name">Done<span>tick</span></div>
            <div class="startup-screen__caption">Getting things ready</div>
          </div>
          <div class="startup-screen__dots" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
