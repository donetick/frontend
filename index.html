<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/logo.svg" /> -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Donetick</title>

    <!-- Inline so startup is visible before JavaScript and app CSS load. -->
    <style>
      .startup-screen {
        --startup-bg: var(--startup-skin-bg, #fbfcfe);
        --startup-surface: #ffffff;
        --startup-text: #20252b;
        --startup-muted: #747b87;
        --startup-accent: var(--startup-skin-accent, #0891b2);
        --startup-soft: var(--startup-skin-soft, #cffafe);
        --startup-halo: var(--startup-skin-halo, #a5f3fc);
        --startup-border: #e9eaf0;
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: auto;
        background: var(--startup-bg);
        color: var(--startup-text);
        font-family: system-ui, sans-serif;
      }
      /* Never let the bare page show white while booting. */
      :root.startup-booting {
        background: var(--startup-skin-bg, #fbfcfe);
      }
      :root.startup-booting[data-startup-mode='dark'] {
        background: var(--startup-skin-bg, #101216);
      }
      /* The boot overlay sits above #root until the app has a page to show. */
      #startup {
        z-index: 2147483000;
        transition: opacity 200ms ease-out;
      }
      #startup.startup-screen--leaving {
        opacity: 0;
        pointer-events: none;
      }
      .startup-screen__content {
        position: relative;
        padding: 32px 24px;
        text-align: center;
      }
      /* Slow/offline details hang below so the visual never shifts. */
      .startup-screen__details {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        right: 0;
      }
      .startup-screen__visual {
        position: relative;
        width: 280px;
        height: 220px;
        margin: 0 auto 24px;
        animation: startup-enter 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .startup-screen__halo {
        position: absolute;
        inset: 12px 30px;
        border-radius: 50%;
        background: radial-gradient(
          ellipse,
          var(--startup-halo) 0%,
          transparent 70%
        );
        filter: blur(16px);
        animation: startup-breathe 4s ease-in-out infinite;
      }
      .startup-screen__mascot {
        position: absolute;
        inset: 48px auto auto 78px;
        width: 124px;
        height: 124px;
        display: grid;
        place-items: center;
        border-radius: 36px;
        background: var(--startup-surface);
        border: 1px solid var(--startup-border);
        box-shadow: 0 16px 48px -16px #155e7530;
        transform: rotate(-6deg);
        animation: startup-float 5s ease-in-out infinite;
      }
      .startup-screen__mascot img {
        display: block;
        width: 88px;
        height: 88px;
      }
      .startup-screen__card {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 10px;
        width: 126px;
        padding: 14px;
        box-sizing: border-box;
        border: 1px solid var(--startup-border);
        border-radius: 18px;
        background: var(--startup-surface);
        box-shadow: 0 8px 24px -12px #155e7530;
      }
      .startup-screen__card--back {
        top: 22px;
        right: 0;
        transform: rotate(9deg);
        animation: startup-card-back 5s ease-in-out infinite;
      }
      .startup-screen__card--front {
        bottom: 12px;
        left: 0;
        transform: rotate(-8deg);
        animation: startup-card-front 5s ease-in-out infinite;
      }
      .startup-screen__check {
        display: grid;
        place-items: center;
        flex: 0 0 26px;
        height: 26px;
        border-radius: 9px;
        background: var(--startup-soft);
        color: var(--startup-accent);
        font-size: 16px;
        font-weight: 700;
      }
      .startup-screen__card--front .startup-screen__check {
        background: #e2f5ef;
        color: #378776;
      }
      .startup-screen__lines {
        display: grid;
        gap: 7px;
        flex: 1;
      }
      .startup-screen__lines span {
        height: 5px;
        border-radius: 8px;
        background: var(--startup-border);
      }
      .startup-screen__lines span + span {
        width: 65%;
      }
      .startup-screen__spark {
        position: absolute;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #f2c589;
      }
      .startup-screen__spark--one {
        top: 40px;
        left: 30px;
      }
      .startup-screen__spark--two {
        right: 26px;
        bottom: 36px;
        width: 5px;
        height: 5px;
        background: var(--startup-accent);
      }
      .startup-screen__copy {
        animation: startup-enter 700ms cubic-bezier(0.22, 1, 0.36, 1) 100ms both;
      }
      .startup-screen__name {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1.2;
      }
      .startup-screen__name span {
        color: var(--startup-accent);
      }
      .startup-screen__caption {
        margin-top: 12px;
        color: var(--startup-muted);
        font-size: 15px;
        line-height: 1.5;
      }
      .startup-screen__dots {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-top: 28px;
      }
      .startup-screen__dots span {
        width: 6px;
        height: 6px;
        border-radius: 99px;
        background: var(--startup-accent);
        animation: startup-dot 1.6s ease-in-out infinite;
      }
      .startup-screen__dots span:nth-child(2) {
        animation-delay: 160ms;
      }
      .startup-screen__dots span:nth-child(3) {
        animation-delay: 320ms;
      }
      @keyframes startup-enter {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes startup-breathe {
        50% {
          transform: scale(1.12);
          opacity: 0.65;
        }
      }
      @keyframes startup-float {
        50% {
          transform: translateY(-7px) rotate(-3deg);
        }
      }
      @keyframes startup-card-back {
        50% {
          transform: translateY(5px) rotate(6deg);
        }
      }
      @keyframes startup-card-front {
        50% {
          transform: translateY(-4px) rotate(-4deg);
        }
      }
      @keyframes startup-dot {
        0%,
        60%,
        100% {
          opacity: 0.3;
          transform: translateY(0);
        }
        30% {
          opacity: 1;
          transform: translateY(-4px);
        }
      }
      /* Set before first paint by the script below, from the saved theme mode. */
      :root[data-startup-mode='dark'] .startup-screen {
        --startup-bg: var(--startup-skin-bg, #101216);
        --startup-surface: #1b1e25;
        --startup-text: #f0f1f5;
        --startup-muted: #9ca3b1;
        --startup-accent: var(--startup-skin-accent, #67e8f9);
        --startup-soft: var(--startup-skin-soft, #164e63);
        --startup-halo: var(--startup-skin-halo, #155e75);
        --startup-border: #2b2f39;
      }
      :root[data-startup-mode='dark']
        .startup-screen__card--front
        .startup-screen__check {
        background: #203c36;
        color: #8ed7bd;
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-screen .startup-screen__content,
        .startup-screen .startup-screen__content * {
          animation: none;
        }
      }
    </style>

    <!--
      Match the startup screen to the app's theme before first paint, so the
      hand-off doesn't flip light/dark or change the skin's colours. Keys must
      stay in sync with useStickyState('themeMode') and src/utils/StartupTheme.js.
    -->
    <script>
      ;(function () {
        var root = document.documentElement
        var mode = null
        try {
          mode = JSON.parse(localStorage.getItem('themeMode'))
        } catch (e) {}
        if (mode !== 'light' && mode !== 'dark') {
          mode =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        }
        root.setAttribute('data-startup-mode', mode)
        root.classList.add('startup-booting')
        try {
          var skin = JSON.parse(localStorage.getItem('donetick-startup-theme'))
          var colors = skin && skin[mode]
          if (!colors) return
          for (var name in colors) {
            root.style.setProperty('--startup-skin-' + name, colors[name])
          }
        } catch (e) {}
      })()
    </script>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />

    <!--
      Plausible. This index.html is shared by the app and the marketing bundles
      (see src/main.jsx), so the tag is gated rather than hardcoded: it loads
      only when the page host matches VITE_APP_PLAUSIBLE_DOMAIN, which is the
      site registered in Plausible. On app.donetick.com the host never matches,
      so nothing loads. Unset the variable to disable it entirely.
    -->
    <script>
      ;(function () {
        var domain = 'donetick.com'
        // Vite leaves the literal placeholder when the variable is unset.
        var host = window.location.hostname
        if (host !== domain) return
        var s = document.createElement('script')
        s.defer = true
        // s.setAttribute('data-domain', domain)
        s.setAttribute('data-domain', 'donetick.com')
        s.src = 'https://collector.wannaknow.link/js/script.js'
        document.head.appendChild(s)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Outside #root so React never replaces it: it stays put through bundle,
      translation and first data loading, then src/utils/StartupOverlay.js
      fades it out once. Markup matches src/components/StartupScreen.jsx.
    -->
    <div
      id="startup"
      class="startup-screen"
      role="status"
      aria-label="Loading Donetick"
    >
      <div class="startup-screen__content">
        <div class="startup-screen__visual" aria-hidden="true">
          <div class="startup-screen__halo"></div>
          <div class="startup-screen__card startup-screen__card--back">
            <span class="startup-screen__check">✓</span>
            <span class="startup-screen__lines"
              ><span></span><span></span
            ></span>
          </div>
          <div class="startup-screen__mascot">
            <img src="/src/assets/logo.svg" width="88" height="88" alt="" />
          </div>
          <div class="startup-screen__card startup-screen__card--front">
            <span class="startup-screen__check">✓</span>
            <span class="startup-screen__lines"
              ><span></span><span></span
            ></span>
          </div>
          <span class="startup-screen__spark startup-screen__spark--one"></span>
          <span class="startup-screen__spark startup-screen__spark--two"></span>
        </div>
        <div class="startup-screen__copy">
          <div class="startup-screen__name">Done<span>tick</span></div>
          <div class="startup-screen__caption">Getting things ready</div>
        </div>
        <div class="startup-screen__dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
    <!--
      Native apps keep the launch screen up (capacitor.config.ts sets
      launchAutoHide: false). Hide it once the screen above has painted, without
      waiting for the app bundle, so launch screen -> startup screen has no
      blank WebView frame between them. src/main.jsx repeats this as a fallback.
    -->
    <script>
      ;(function () {
        var splash =
          window.Capacitor &&
          window.Capacitor.Plugins &&
          window.Capacitor.Plugins.SplashScreen
        if (!splash) return
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            splash.hide({ fadeOutDuration: 200 }).catch(function () {})
          })
        })
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
