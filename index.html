<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/logo.svg" /> -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Donetick</title>

    <!-- Inline so startup is visible before JavaScript and app CSS load. -->
    <style>
      .startup-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #ffffff;
        color: #171a1c;
        font-family: system-ui, sans-serif;
      }
      .startup-screen__name {
        font-size: 28px;
        font-weight: 700;
      }
      .startup-screen__spinner {
        width: 28px;
        height: 28px;
        box-sizing: border-box;
        border: 3px solid currentColor;
        border-inline-end-color: transparent;
        border-radius: 50%;
        animation: startup-spin 0.8s linear infinite;
      }
      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        .startup-screen {
          background: #0b0d0e;
          color: #f0f4f8;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-screen__spinner {
          animation: none;
        }
      }
    </style>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />

    <!--
      Plausible. This index.html is shared by the app and the marketing bundles
      (see src/main.jsx), so the tag is gated rather than hardcoded: it loads
      only when the page host matches VITE_APP_PLAUSIBLE_DOMAIN, which is the
      site registered in Plausible. On app.donetick.com the host never matches,
      so nothing loads. Unset the variable to disable it entirely.
    -->
    <script>
      ;(function () {
        var domain = 'donetick.com'
        // Vite leaves the literal placeholder when the variable is unset.
        var host = window.location.hostname
        if (host !== domain) return
        var s = document.createElement('script')
        s.defer = true
        // s.setAttribute('data-domain', domain)
        s.setAttribute('data-domain', 'donetick.com')
        s.src = 'https://collector.wannaknow.link/js/script.js'
        document.head.appendChild(s)
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <!-- React replaces this with the matching Suspense fallback on mount. -->
      <div class="startup-screen" role="status" aria-label="Loading Donetick">
        <span class="startup-screen__name">Donetick</span>
        <span class="startup-screen__spinner" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
